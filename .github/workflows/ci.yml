# Einfache CI für Querencia-Rust-Repos: Format, Lints, Tests – ohne Bildschirm.
# Die isolierte GUI-Prüfung (labwc, Bildschirmfotos) läuft NICHT hier, sondern
# bei der Entwicklung (siehe docs/testing.md).
#
# Querencia Archiv: ENTWICKLUNGSPAKETE mit libarchive-dev (compress-tools und die
# eigene Schreib-Anbindung), ohne gtk4-layer-shell/xkbcommon (nicht gebraucht); gzip,
# weil ein Kerntest eine einzelne .gz-Datei mit dem Werkzeug erzeugt.
# NICHT AUF GITHUB GETESTET (kein Zugang bei der Erstellung): beim ersten
# privaten Push prüfen und die Abschnitte „Annahmen“ bestätigen.
#
# Annahmen:
#  - Die Programme brauchen GTK 4.22 und gtk4-layer-shell/VTE (Ubuntu 26.04).
#    GitHubs `ubuntu-latest` ist älter, deshalb läuft der Job im Container
#    `ubuntu:26.04` (Image muss auf Docker Hub verfügbar sein).
#  - Rust aus dem Ubuntu-Archiv (rustc/cargo 1.93). Braucht ein Repo eine neuere
#    Toolchain (Querencia Files: 1.98.1), den Block „Rust über rustup“ nutzen.
name: CI

on:
  push:
    branches: [main, querencia]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pro Repo anpassen. Namen für Ubuntu 26.04; auf der Entwicklungs-VM sind gtk4 4.22.4,
  # gtk4-layer-shell-0 1.3.0, vte-2.91-gtk4 0.84.0 als pkg-config-Module vorhanden,
  # die -dev-Paketnamen hier sind auf der VM (Ubuntu 26.04) installiert und damit gültig
  # (GH-2, 19.10.2026); im Container ubuntu:26.04 nicht getestet. python3 braucht der
  # Schritt „Lizenzen der Abhängigkeiten“ (fehlt im Container sonst):
  ENTWICKLUNGSPAKETE: >-
    libgtk-4-dev libglib2.0-dev libcairo2-dev libpango1.0-dev
    libgdk-pixbuf-2.0-dev libgraphene-1.0-dev libarchive-dev
    gzip

jobs:
  pruefen:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 45
    steps:
      - name: Werkzeuge installieren
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config rustc cargo rust-clippy rustfmt python3 \
            ${ENTWICKLUNGSPAKETE}

      # Block „Rust über rustup“ (nur wenn nötig; dann rust-clippy/rustfmt/rustc/cargo
      # oben aus der apt-Zeile streichen):
      # - name: Rust über rustup
      #   run: |
      #     apt-get install -y --no-install-recommends curl
      #     curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
      #       --default-toolchain 1.98.1 --profile minimal -c clippy -c rustfmt
      #     echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Git-Eigentümer erlauben (Container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cargo-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (ohne Bildschirm)
        # GUI-Tests, die einen Anzeigeserver brauchen, sind im Repo mit
        # #[ignore] markiert; die laufen in der isolierten Prüfung.
        run: cargo test --locked

      - name: Lizenzen der Abhängigkeiten (Information)
        if: always()
        run: |
          cargo metadata --locked --format-version 1 \
            | python3 -c "import json,sys,collections; m=json.load(sys.stdin); c=collections.Counter(p.get('license') or 'KEINE ANGABE' for p in m['packages'] if p['source']); [print(n,l) for l,n in c.most_common()]"
